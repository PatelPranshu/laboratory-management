<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients Registry - MyPathoLabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 antialiased text-slate-800 selection:bg-brand-500 selection:text-white">

    <div class="flex h-screen overflow-hidden bg-slate-100">
        
        <!-- Main Content -->
        <main class="flex-1 relative overflow-y-auto focus:outline-none custom-scrollbar pb-12">
            <!-- Top Header -->
            <header class="bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-8 py-4 sm:py-5 sticky top-0 z-10 gap-4">
                <!-- Desktop-only Header Content (Screenshot style) -->
                <div class="hidden lg:flex items-center flex-1">
                    <div class="flex flex-col">
                        <!-- Breadcrumbs -->
                        <nav class="flex mb-1" aria-label="Breadcrumb">
                          <ol class="inline-flex items-center space-x-1 text-xs font-semibold text-slate-500">
                            <li class="inline-flex items-center hover:text-brand-600 transition-colors">
                              <a href="dashboard.html" class="inline-flex items-center"><i class="fas fa-home mr-1.5 text-[10px]"></i>Dashboard</a>
                            </li>
                            <li>
                              <div class="flex items-center text-slate-400">
                                <i class="fas fa-chevron-right text-[9px] mx-1"></i>
                                <span class="text-slate-700 font-bold">Patients</span>
                              </div>
                            </li>
                          </ol>
                        </nav>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight leading-none mt-1">Patients Directory</h1>
                    </div>
                    
                    <!-- Desktop Page Actions -->
                    <div class="flex items-center gap-3 ml-auto mr-2">
                        <button onclick="exportCSV()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-xl shadow-sm transition-all flex items-center font-bold text-sm active:scale-95">
                            <i class="fas fa-file-csv mr-2 text-brand-500"></i> Export
                        </button>
                        <button onclick="PatientModal.open({ mode: 'create', onSuccess: (p) => window.location.href = 'patient-profile.html?id=' + p._id })" class="bg-brand-600 hover:bg-brand-500 text-white px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center font-bold text-sm active:scale-95">
                            <i class="fas fa-plus mr-2"></i> Add Patient
                        </button>
                    </div>
                </div>

                <!-- Mobile-only Placeholder (keeps layout on mobile, hidden on desktop) -->
                <div class="lg:hidden flex-1 w-full max-w-2xl flex relative opacity-0">
                    <!-- Placeholder to keep layout even if not using global search here -->
                </div>

                <!-- Notification Bell Container (visible on both mobile and desktop) -->
                <div class="ml-auto lg:ml-0 flex items-center space-x-4 shrink-0" id="header-actions">
                </div>
            </header>
 
            <div class="px-4 py-6 sm:px-8 sm:py-8 max-w-[1600px] mx-auto">
                
                <!-- Mobile-only Breadcrumbs (hidden on desktop) -->
                <nav class="flex mb-4 lg:hidden" aria-label="Breadcrumb">
                  <ol class="inline-flex items-center space-x-1 md:space-x-2 text-xs font-semibold text-slate-500">
                    <li class="inline-flex items-center hover:text-brand-600 transition-colors">
                      <a href="dashboard.html" class="inline-flex items-center"><i class="fas fa-home mr-1.5 text-[10px]"></i>Dashboard</a>
                    </li>
                    <li>
                      <div class="flex items-center text-slate-400">
                        <i class="fas fa-chevron-right text-[9px] mx-1"></i>
                        <span class="text-slate-700 font-bold">Patients</span>
                      </div>
                    </li>
                  </ol>
                </nav>
                
                <!-- Mobile-only Title/Actions Row (hidden on desktop) -->
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-6 mb-8 lg:hidden">
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight">Patients Directory</h1>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1">Manage all registered patients, their information, and historical data.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="exportCSV()" class="flex-1 sm:flex-none justify-center bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-xl shadow-sm transition-all flex items-center font-bold text-sm">
                            <i class="fas fa-file-csv mr-2 text-brand-500"></i> Export
                        </button>
                        <button onclick="PatientModal.open({ mode: 'create', onSuccess: (p) => window.location.href = 'patient-profile.html?id=' + p._id })" class="flex-1 sm:flex-none justify-center bg-brand-600 hover:bg-brand-500 text-white px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center font-bold text-sm">
                            <i class="fas fa-plus mr-2"></i> Add Patient
                        </button>
                    </div>
                </div>

                <!-- Search and Filter Grid -->
                <div class="glass-card p-5 mb-8 bg-white border border-slate-200 shadow-sm rounded-2xl">
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-end">
                        <!-- Text Search -->
                        <div class="md:col-span-4 relative group">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Search Identifier</label>
                            <div class="relative">
                                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-brand-500 transition-colors"></i>
                                <input type="text" id="patient-search" placeholder="Search by name, phone..." class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-semibold text-slate-900 transition-all placeholder-slate-400">
                            </div>
                        </div>

                        <!-- Date Filters -->
                        <div class="md:col-span-3">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Created From</label>
                            <input type="date" id="filter-from-date" class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-xs font-bold text-slate-800">
                        </div>

                        <div class="md:col-span-3">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Created To</label>
                            <input type="date" id="filter-to-date" class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 text-xs font-bold text-slate-800">
                        </div>

                        <!-- Action Button -->
                        <div class="md:col-span-2">
                            <button onclick="applySearch()" class="w-full bg-brand-600 hover:bg-brand-700 text-white px-2 py-[11px] rounded-xl transition-all font-bold shadow-md text-[11px] flex items-center justify-center group tracking-tighter">
                                <i class="fas fa-filter mr-1.5 text-brand-200 group-hover:text-white transition-colors"></i> Apply
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="glass-card overflow-hidden bg-white border border-slate-200">
                    <div class="overflow-x-auto min-h-[400px]">
                        <table class="min-w-full divide-y divide-slate-100 border-collapse block sm:table">
                            <thead class="bg-slate-50 hidden sm:table-header-group">
                                <tr>
                                    <th class="px-7 py-5 text-left text-xs font-bold text-slate-500 uppercase tracking-wider w-1/3">Patient Identity</th>
                                    <th class="px-7 py-5 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Contact Info</th>
                                    <th class="px-7 py-5 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Demographics</th>
                                    <th class="px-7 py-5 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="patients-list" class="divide-y divide-slate-100 bg-white block sm:table-row-group">
                                <!-- Populated via JS -->
                                <tr><td colspan="4" class="text-center py-20 block sm:table-cell"><i class="fas fa-circle-notch fa-spin text-4xl text-brand-500"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="bg-white px-6 py-4 border-t border-slate-100 flex items-center justify-between">
                        <div class="flex-1 flex justify-between sm:hidden">
                            <button onclick="loadPatients(currentPage > 1 ? currentPage - 1 : 1)" class="relative inline-flex items-center px-4 py-2 border border-slate-200 text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50">Previous</button>
                            <button onclick="loadPatients(currentPage + 1)" class="ml-3 relative inline-flex items-center px-4 py-2 border border-slate-200 text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50">Next</button>
                        </div>
                        <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                            <div>
                                <p class="text-sm font-medium text-slate-500" id="pagination-info">
                                    Loading pagination...
                                </p>
                            </div>
                            <div>
                                <nav class="relative z-0 inline-flex rounded-lg shadow-sm -space-x-px" aria-label="Pagination" id="pagination-controls">
                                    <!-- Pagination Buttons -->
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

    <script src="js/patientModal.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentPage = 1;
        let searchQuery = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadCommonLayout();
            checkAuth();
            loadPatients(1);

            // Auto-refresh patients list when user switches back to this tab (10s throttle)
            if (typeof TabFocusRefresh !== 'undefined') {
                TabFocusRefresh.register(() => loadPatients(currentPage));
            }
        });

        async function loadPatients(page = 1) {
            currentPage = page;
            const fromDate = document.getElementById('filter-from-date').value;
            const toDate = document.getElementById('filter-to-date').value;

            const tbody = document.getElementById('patients-list');
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-20 block sm:table-cell"><i class="fas fa-circle-notch fa-spin text-4xl text-brand-500"></i></td></tr>`;
            
            try {
                const searchParam = searchQuery ? `&search=${encodeURIComponent(searchQuery)}` : '';
                const dateParams = `&fromDate=${fromDate}&toDate=${toDate}`;
                const res = await api.request(`/patients?page=${page}&limit=10${searchParam}${dateParams}`);
                const data = res.data;
                const pagination = res.pagination;
 
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-20 text-slate-500 font-medium block sm:table-cell">No patients found.</td></tr>`;
                } else {
                    tbody.innerHTML = data.map(p => {
                        const reportActionBtn = `<a href="report-create.html?patient=${p._id}" class="p-2.5 sm:p-2 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 hover:text-emerald-700 rounded-xl sm:rounded-lg transition-colors tooltip-container font-bold text-xs flex items-center gap-1.5" title="Create New Report"><i class="fas fa-file-medical text-sm sm:text-xs"></i><span class="sm:hidden">New Report</span></a>`;
                        const viewProfileBtn = `<a href="patient-profile.html?id=${p._id}" class="p-2.5 sm:p-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 hover:text-indigo-700 rounded-xl sm:rounded-lg transition-colors tooltip-container font-bold text-xs flex items-center gap-1.5" title="View Patient Profile"><i class="fas fa-user-circle text-sm sm:text-xs"></i><span class="sm:hidden">Profile</span></a>`;
                        const deleteBtn = `<button onclick="deletePatient('${p._id}')" class="p-2.5 sm:p-2 bg-red-50 text-red-500 hover:bg-red-100 hover:text-red-700 rounded-xl sm:rounded-lg transition-colors tooltip-container font-bold text-xs flex items-center gap-1.5" title="Delete"><i class="fas fa-trash-alt text-sm sm:text-xs"></i><span class="sm:hidden">Delete</span></button>`;
                        
                        const genderIcon = p.gender.toLowerCase() === 'male' ? 'mars' : p.gender.toLowerCase() === 'female' ? 'venus' : 'genderless';
                        return `
                        <tr onclick="window.location.href='patient-profile.html?id=${p._id}'" class="flex sm:table-row flex-col sm:flex-row hover:bg-brand-50/40 transition-colors group cursor-pointer p-5 sm:p-0 border-b border-slate-100 last:border-0 sm:border-0">
                            <td class="p-0 sm:px-7 sm:py-4 flex sm:table-cell items-center min-w-0 w-full sm:w-1/3">
                                <div class="flex items-center min-w-0 w-full">
                                    <div class="flex-shrink-0 h-10 w-10 rounded-xl bg-gradient-to-br from-brand-100 to-indigo-100 text-brand-700 flex items-center justify-center font-bold shadow-sm border border-white">
                                        ${sanitizeHTML(p.name.charAt(0))}
                                    </div>
                                    <div class="ml-3 sm:ml-4 min-w-0 flex-1">
                                        <a href="patient-profile.html?id=${p._id}" class="text-sm font-bold text-slate-800 hover:text-brand-600 transition-colors block truncate">${sanitizeHTML(p.name)}</a>
                                        <div class="text-[10px] text-slate-400 font-bold mt-0.5 sm:text-xs sm:text-slate-500 sm:font-medium">ID: ${p._id.slice(-12).toUpperCase()}</div>
                                        
                                        <!-- Mobile-only Contact & Demographics -->
                                        <div class="mt-2.5 flex flex-wrap items-center gap-2 sm:hidden">
                                            <span class="px-2 py-0.5 text-[10px] font-bold bg-slate-100 text-slate-600 rounded-md border border-slate-200/50">${p.age} yrs</span>
                                            <span class="px-2 py-0.5 text-[10px] font-bold bg-slate-100 text-slate-600 rounded-md border border-slate-200/50"><i class="fas fa-${genderIcon} mr-1 opacity-70"></i>${sanitizeHTML(p.gender)}</span>
                                            ${p.phone ? `<span class="text-slate-500 text-[11px] font-semibold bg-slate-50 border border-slate-100 rounded-md px-2 py-0.5 flex items-center"><i class="fas fa-phone-alt text-slate-400 mr-1.5"></i>${sanitizeHTML(p.phone)}</span>` : ''}
                                            ${p.email ? `<span class="text-slate-500 text-[11px] font-semibold bg-slate-50 border border-slate-100 rounded-md px-2 py-0.5 flex items-center"><i class="fas fa-envelope text-slate-400 mr-1.5"></i>${sanitizeHTML(p.email)}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="hidden sm:table-cell px-7 py-4 whitespace-nowrap">
                                <div class="text-sm font-bold text-slate-700"><i class="fas fa-phone-alt text-slate-400 mr-1.5 text-xs"></i>${sanitizeHTML(p.phone)}</div>
                                ${p.email ? `<div class="text-xs text-slate-500 font-medium mt-1"><i class="fas fa-envelope text-slate-400 mr-1.5"></i>${sanitizeHTML(p.email)}</div>` : ''}
                            </td>
                            <td class="hidden sm:table-cell px-7 py-4 whitespace-nowrap">
                                <span class="px-2.5 py-1 text-xs font-bold bg-slate-100 text-slate-600 rounded-lg mr-2">${p.age} years</span>
                                <span class="px-2.5 py-1 text-xs font-bold bg-slate-100 text-slate-600 rounded-lg"><i class="fas fa-${genderIcon} mr-1 opacity-70"></i>${sanitizeHTML(p.gender)}</span>
                            </td>
                            <td class="p-0 sm:px-7 sm:py-4 flex sm:table-cell items-center justify-end mt-3.5 sm:mt-0 w-full sm:w-auto border-t border-slate-100 sm:border-0 pt-3 sm:pt-0 shrink-0" onclick="event.stopPropagation()">
                                <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                    ${reportActionBtn}
                                    ${viewProfileBtn}
                                    ${deleteBtn}
                                </div>
                            </td>
                        </tr>
                    `}).join('');
                }
 
                updatePaginationUI(pagination);
            } catch (err) {
                UI.showToast('Failed to load patients', 'error');
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-20 text-red-500 font-bold block sm:table-cell">Failed to load data.</td></tr>`;
            }
        }

        function updatePaginationUI(p) {
            const info = document.getElementById('pagination-info');
            const start = (p.page - 1) * p.limit + 1;
            const end = Math.min(p.page * p.limit, p.total);
            const total = p.total;
            if (total === 0) {
                 info.innerHTML = `Showing <span class="font-bold text-slate-800">0</span> results`;
            } else {
                 info.innerHTML = `Showing <span class="font-bold text-slate-800">${start}</span> to <span class="font-bold text-slate-800">${end}</span> of <span class="font-bold text-slate-800">${total}</span> results`;
            }

            const controls = document.getElementById('pagination-controls');
            let btns = '';
            
            if (p.page > 1) {
                btns += `<button onclick="loadPatients(${p.page - 1})" class="relative inline-flex items-center px-3 py-2 rounded-l-lg border border-slate-200 bg-white text-sm font-medium text-slate-500 hover:bg-slate-50 transition-colors"><i class="fas fa-chevron-left"></i></button>`;
            } else {
                btns += `<button disabled class="relative inline-flex items-center px-3 py-2 rounded-l-lg border border-slate-200 bg-slate-50 text-sm font-medium text-slate-300 cursor-not-allowed"><i class="fas fa-chevron-left"></i></button>`;
            }

            for(let i=1; i<=p.pages; i++) {
                if(i === p.page) {
                     btns += `<span class="relative inline-flex items-center px-4 py-2 border border-brand-500 bg-brand-50 text-sm font-bold text-brand-600 z-10">${i}</span>`;
                } else {
                     btns += `<button onclick="loadPatients(${i})" class="relative inline-flex items-center px-4 py-2 border border-slate-200 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">${i}</button>`;
                }
            }

            if (p.page < p.pages) {
                btns += `<button onclick="loadPatients(${p.page + 1})" class="relative inline-flex items-center px-3 py-2 rounded-r-lg border border-slate-200 bg-white text-sm font-medium text-slate-500 hover:bg-slate-50 transition-colors"><i class="fas fa-chevron-right"></i></button>`;
            } else {
                btns += `<button disabled class="relative inline-flex items-center px-3 py-2 rounded-r-lg border border-slate-200 bg-slate-50 text-sm font-medium text-slate-300 cursor-not-allowed"><i class="fas fa-chevron-right"></i></button>`;
            }

            controls.innerHTML = btns;
        }

        function applySearch() {
            searchQuery = document.getElementById('patient-search').value;
            loadPatients(1);
        }

        const savePatientDraftSet = DraftManager.debounce(() => {
            // Only save draft if in create mode (no id)
            if (document.getElementById('patient-id').value) return;

            const data = {
                name: document.getElementById('p-name').value,
                phone: document.getElementById('p-phone').value,
                age: document.getElementById('p-age').value,
                gender: document.getElementById('p-gender').value,
                address: document.getElementById('p-address').value
            };
            // Check if any field is not empty before saving
            if (Object.values(data).some(v => v && v.trim !== '')) {
                DraftManager.save('patient', data);
            }
        }, 500);

        // Attach auto-save listeners
        ['p-name', 'p-phone', 'p-age', 'p-gender', 'p-address'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', savePatientDraftSet);
        });

        document.getElementById('patient-search').addEventListener('keypress', (e) => {
             if (e.key === 'Enter') applySearch();
        });



        async function deletePatient(id) {
            const confirmed = await UI.showConfirm('Delete Patient', 'Are you sure you want to delete this patient? This action cannot be undone.', 'Delete', 'danger');
            if (confirmed) {
                try {
                    await api.request(`/patients/${id}`, 'DELETE');
                    UI.showToast('Patient deleted', 'success');
                    loadPatients(1);
                } catch (err) {
                     UI.showToast(err.message, 'error');
                }
            }
        }

        async function exportCSV() {
            try {
                UI.showToast('Preparing CSV Export...', 'success');
                const searchParam = searchQuery ? `&search=${encodeURIComponent(searchQuery)}` : '';
                // Fetch all data for export by setting a large limit
                const res = await api.request(`/patients?page=1&limit=1000${searchParam}`);
                const patients = res.data;
                
                if (patients.length === 0) {
                    return UI.showToast('No data to export', 'error');
                }

                const headers = ['Identity', 'Name', 'Phone', 'Email', 'Age', 'Gender', 'Registration Date'];
                const csvData = patients.map(p => [
                    p._id.slice(-12).toUpperCase(),
                    `"${p.name.replace(/"/g, '""')}"`,
                    p.phone || 'N/A',
                    p.email || 'N/A',
                    p.age,
                    p.gender,
                    new Date(p.createdAt).toLocaleDateString()
                ]);

                const csvContent = [headers.join(','), ...csvData.map(row => row.join(','))].join('\n');
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `MyPathoLabs_Patients_${new Date().toISOString().slice(0,10)}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                UI.showToast('Export successful!', 'success');

            } catch (error) {
                UI.showToast('Export failed', 'error');
            }
        }
    </script>
</body>
</html>
