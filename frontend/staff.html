<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management - MyPathoLabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="js/datadog-init.js"></script>
</head>
<body class="bg-slate-50 antialiased text-slate-800 selection:bg-brand-500 selection:text-white">

    <div class="flex h-screen overflow-hidden bg-slate-100">
        
        <!-- Sidebar Layout Injected via JS -->

        <!-- Main Content -->
        <main class="flex-1 relative overflow-y-auto focus:outline-none custom-scrollbar pb-12">
            
            <!-- Top Header -->
            <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-3 sm:py-4 flex items-center justify-between sticky top-0 z-10 gap-4 shrink-0">
                <!-- Desktop-only Header Content -->
                <div class="hidden lg:flex items-center flex-1">
                    <div class="flex flex-col">
                        <!-- Breadcrumbs -->
                        <nav class="flex mb-1" aria-label="Breadcrumb">
                          <ol class="inline-flex items-center space-x-1 text-xs font-semibold text-slate-500">
                            <li class="inline-flex items-center hover:text-brand-600 transition-colors">
                              <a href="dashboard.html" class="inline-flex items-center"><i class="fas fa-home mr-1.5 text-[10px]"></i>Dashboard</a>
                            </li>
                            <li>
                              <div class="flex items-center text-slate-400">
                                <i class="fas fa-chevron-right text-[9px] mx-1"></i>
                                <span class="text-slate-700 font-bold">Team Management</span>
                              </div>
                            </li>
                          </ol>
                        </nav>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight leading-none mt-1">Team Management</h1>
                    </div>
                    
                    <!-- Desktop Page Actions -->
                    <div class="flex items-center gap-3 ml-auto mr-2">
                        <button onclick="openInviteModal()" class="bg-brand-600 hover:bg-brand-500 text-white px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center font-bold text-sm active:scale-95">
                            <i class="fas fa-plus mr-2"></i> Add Staff
                        </button>
                    </div>
                </div>

                <!-- Mobile-only Placeholder (keeps layout on mobile, hidden on desktop) -->
                <div class="lg:hidden flex-1 w-full max-w-2xl flex relative opacity-0">
                    <!-- Placeholder to keep layout even if not using global search here -->
                </div>
            </header>

            <div class="px-4 py-6 sm:px-8 sm:py-8 max-w-[1600px] mx-auto">
                
                <!-- Mobile-only Page Header -->
                <div class="lg:hidden mb-6 flex flex-col gap-4">
                    <div>
                        <nav class="flex mb-2" aria-label="Breadcrumb">
                          <ol class="inline-flex items-center space-x-1 text-xs font-semibold text-slate-500">
                            <li class="inline-flex items-center">
                              <a href="dashboard.html"><i class="fas fa-home mr-1.5 text-[10px]"></i>Dashboard</a>
                            </li>
                            <li>
                              <div class="flex items-center text-slate-400">
                                <i class="fas fa-chevron-right text-[9px] mx-1"></i>
                                <span class="text-slate-700 font-bold">Team</span>
                              </div>
                            </li>
                          </ol>
                        </nav>
                        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight flex items-center group">
                            <i class="fas fa-user-shield text-brand-500 mr-2 transition-transform"></i>
                            Team Management
                        </h1>
                        <p class="text-slate-500 mt-1 text-xs max-w-xl leading-relaxed">Manage your secure laboratory staff portal.</p>
                    </div>
                    <div class="flex items-center gap-3 w-full">
                        <button onclick="openInviteModal()" class="flex-1 justify-center px-4 py-2.5 bg-gradient-to-br from-brand-500 to-brand-600 text-white border border-transparent rounded-xl font-bold shadow-md transition-all text-sm flex items-center gap-2">
                            <i class="fas fa-plus"></i> Add Staff
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
                    <div class="overflow-x-auto min-h-[400px]">
                        <table class="w-full text-sm text-left block sm:table">
                            <thead class="text-[10px] sm:text-xs text-slate-500 bg-slate-50/80 uppercase font-bold tracking-wider hidden sm:table-header-group">
                                <tr>
                                    <th scope="col" class="px-4 sm:px-6 py-4">Staff Member</th>
                                    <th scope="col" class="px-6 py-4">Email</th>
                                    <th scope="col" class="px-6 py-4">Role</th>
                                    <th scope="col" class="px-6 py-4">Status</th>
                                    <th scope="col" class="px-4 sm:px-6 py-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="staff-table-body" class="divide-y divide-slate-100 block sm:table-row-group">
                                <tr><td colspan="5" class="px-6 py-8 text-center text-slate-500 block sm:table-cell"><i class="fas fa-spinner fa-spin mr-2"></i>Loading staff...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modals (Hidden by default) -->
    <div id="invite-modal" class="fixed inset-0 bg-slate-900/40 z-50 items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full mx-4 overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-800"><i class="fas fa-envelope text-brand-500 mr-2"></i>Invite Staff</h3>
                <button onclick="closeInviteModal()" class="text-slate-400 hover:text-slate-600 transition-colors cursor-pointer p-1"><i class="fas fa-times text-lg"></i></button>
            </div>
            <div class="p-6">
                <form id="invite-form" onsubmit="handleInvite(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-slate-700 mb-1.5" for="invite-email">Staff Email</label>
                        <input type="email" id="invite-email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring focus:ring-brand-500/20 transition-all text-sm font-medium" placeholder="staff@example.com">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-slate-700 mb-1.5" for="invite-role">Role</label>
                        <select id="invite-role" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring focus:ring-brand-500/20 transition-all text-sm font-medium bg-white">
                            <option value="Doctor">Doctor / Pathologist</option>
                            <option value="LabTech">Lab Technician</option>
                        </select>
                    </div>
                    <div class="mt-6">
                        <button type="submit" id="btn-invite" class="w-full bg-brand-500 text-white font-bold rounded-xl py-2.5 hover:bg-brand-600 transition-all focus:ring focus:ring-brand-500/30">Send Invitation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    

    <!-- Centralized JS -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/layout.js"></script>
    
    <script>
        checkAuth();
    </script>
    <script src="js/staff.js"></script>
</body>
</html>
