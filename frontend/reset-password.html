<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MyPathoLabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 antialiased text-slate-800">
    <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
        
        <div class="absolute inset-0 bg-brand-500/5 -z-10"></div>

        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-[2rem] shadow-xl border border-brand-100/50 relative z-10 text-center" id="card-container">
            
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-brand-50 to-brand-100 shadow-sm border border-brand-200/50 mb-6 transition-all duration-300">
                <i class="fas fa-key text-4xl text-brand-500"></i>
            </div>
            
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Reset Password</h2>
            <p class="text-sm text-slate-500 mb-8 max-w-xs mx-auto font-medium">Please enter your new secure password below.</p>

            <form id="reset-form" class="space-y-5 text-left" onsubmit="handleReset(event)">
                
                <div>
                    <label for="new-password" class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">New Password</label>
                    <div class="relative group">
                        <input id="new-password" type="password" required minlength="8" maxlength="72" class="appearance-none block w-full pl-4 pr-12 py-3 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all font-medium text-sm hover:border-slate-300" placeholder="8-72 chars, 1 uppercase, 1 number">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                            <button type="button" onclick="togglePasswordVisibility('new-password', this)" class="text-slate-400 hover:text-brand-500 focus:outline-none transition-colors">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-bold text-slate-700 mb-1.5 ml-1">Confirm Password</label>
                    <div class="relative group">
                        <input id="confirm-password" type="password" required minlength="8" maxlength="72" class="appearance-none block w-full pl-4 pr-12 py-3 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all font-medium text-sm hover:border-slate-300" placeholder="Re-type new password">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                            <button type="button" onclick="togglePasswordVisibility('confirm-password', this)" class="text-slate-400 hover:text-brand-500 focus:outline-none transition-colors">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 shadow-lg shadow-brand-500/30 transition-all mt-8">
                    Reset Password
                    <i class="fas fa-check ml-2 mt-0.5 transition-transform"></i>
                </button>
            </form>
            
            <div id="error-container" class="mt-8 space-y-5 hidden text-center">
                <div class="p-4 bg-red-50 text-red-600 rounded-xl text-sm font-bold border border-red-100" id="error-msg">
                    Invalid or expired token.
                </div>
            </div>

            <p class="mt-6 text-sm text-slate-500">
                <a href="index.html" class="font-bold text-brand-600 hover:text-brand-800 transition-colors">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('reset-form').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            document.getElementById('error-msg').textContent = 'No reset token provided in the URL.';
        }

        async function handleReset(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                UI.showToast('Passwords do not match!', 'error');
                return;
            }

            UI.toggleLoader('btn-submit', true, '<i class="fas fa-circle-notch fa-spin mr-2"></i> Resetting...');

            try {
                const res = await fetch(`${API_URL}/auth/reset-password-with-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await res.json();

                if (data.success) {
                    UI.showToast('Password updated! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    UI.showToast(data.error || 'Failed to update password', 'error');
                    if (data.error && data.error.includes('Invalid or expired')) {
                        document.getElementById('reset-form').classList.add('hidden');
                        document.getElementById('error-container').classList.remove('hidden');
                        document.getElementById('error-msg').textContent = data.error;
                    }
                }
            } catch (err) {
                UI.showToast('Network error while resetting password', 'error');
            } finally {
                UI.toggleLoader('btn-submit', false, 'Reset Password <i class="fas fa-check ml-2 mt-0.5 transition-transform"></i>');
            }
        }
    </script>
</body>
</html>
