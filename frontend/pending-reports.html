<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Reports - MyPathoLabs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/datadog-init.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased h-full overflow-hidden">
    
    <div id="toast-container" class="fixed top-5 right-5 z-[200] flex flex-col gap-3"></div>

    <div class="flex h-screen overflow-hidden bg-slate-50">
        <!-- Sidebar Layout Injected via JS -->
        
        <main class="flex-1 relative overflow-y-auto focus:outline-none custom-scrollbar pb-12">
            
            <!-- Top Header -->
            <header class="bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-8 py-4 sm:py-5 sticky top-0 z-10 gap-4">
                <!-- Desktop-only Header Content -->
                <div class="hidden lg:flex items-center flex-1">
                    <div class="flex flex-col">
                        <nav class="flex mb-1" aria-label="Breadcrumb">
                            <ol class="inline-flex items-center space-x-1 text-xs font-semibold text-slate-500">
                                <li class="inline-flex items-center hover:text-brand-600 transition-colors"><a href="dashboard.html" class="inline-flex items-center"><i class="fas fa-home mr-1.5 text-[10px]"></i>Dashboard</a></li>
                                <li><div class="flex items-center text-slate-400"><i class="fas fa-chevron-right text-[9px] mx-1"></i><span class="text-slate-700 font-bold">Verification Queue</span></div></li>
                            </ol>
                        </nav>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight leading-none mt-1">Pending Reports</h1>
                    </div>
                </div>

                <!-- Mobile-only Placeholder -->
                <div class="lg:hidden flex-1 w-full max-w-2xl flex relative opacity-0"></div>

                <!-- Notification Bell Container (visible on both mobile and desktop) -->
                <div class="ml-auto lg:ml-0 flex items-center space-x-4 shrink-0" id="header-actions">
                </div>
            </header>

            <div class="px-4 py-6 sm:px-8 sm:py-8 max-w-[1400px] mx-auto space-y-8">
                
                <!-- Mobile-only Breadcrumbs (hidden on desktop) -->
                <nav class="flex lg:hidden" aria-label="Breadcrumb">
                    <ol class="inline-flex items-center space-x-1 md:space-x-2 text-xs font-semibold text-slate-500">
                        <li class="inline-flex items-center hover:text-brand-600 transition-colors">
                            <a href="dashboard.html" class="inline-flex items-center"><i class="fas fa-home mr-1.5 text-[10px]"></i>Dashboard</a>
                        </li>
                        <li>
                            <div class="flex items-center text-slate-400">
                                <i class="fas fa-chevron-right text-[9px] mx-1"></i>
                                <span class="text-slate-700 font-bold">Verification Queue</span>
                            </div>
                        </li>
                    </ol>
                </nav>
                <div class="space-y-8">
                    
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-black text-slate-900 tracking-tight flex items-center">
                                <i class="fas fa-clock text-brand-500 mr-4"></i>
                                Pending Verification
                            </h2>
                            <p class="text-slate-500 mt-2 text-sm font-medium max-w-xl">Reports currently in draft mode awaiting signature or specialist review.</p>
                        </div>
                    </div>

                    <!-- Table Container (Clean & Large) -->
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                        <div class="overflow-x-auto min-h-[500px]">
                            <table class="min-w-full text-left border-collapse block sm:table divide-y divide-slate-100">
                                <thead class="text-xs text-slate-400 bg-slate-50 border-b border-slate-100 uppercase font-black tracking-widest hidden sm:table-header-group">
                                    <tr>
                                        <th scope="col" class="px-8 py-5">Draft Date</th>
                                        <th scope="col" class="px-8 py-5">Patient Details</th>
                                        <th scope="col" class="px-8 py-5">Test Profiles</th>
                                        <th scope="col" class="px-8 py-5">Prepared By</th>
                                        <th scope="col" class="px-8 py-5">Assigned Verifier</th>
                                        <th scope="col" class="px-8 py-5 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="pending-table-body" class="divide-y divide-slate-100 bg-white block sm:table-row-group">
                                    <tr>
                                        <td colspan="6" class="px-8 py-20 text-center text-slate-300 block sm:table-cell">
                                            <i class="fas fa-spinner fa-spin text-2xl mb-4 block text-brand-500"></i>
                                            <span class="text-sm font-bold uppercase tracking-widest">Accessing Document Queue...</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Core Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pending-reports.js"></script>
</body>
</html>
