</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <button onclick="window.location.href='super-admin.html'" class="mr-4 text-slate-400 hover:text-brand-600 transition-colors">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </button>
                    <span class="font-black text-xl tracking-tighter uppercase text-slate-800">MyPatho<span class="text-brand-600">Labs</span></span>
                    <span class="ml-4 px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 text-xs font-bold tracking-wide uppercase">Lab Details</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 id="lab-name-header" class="text-3xl font-black text-slate-800 tracking-tight">Loading...</h1>
                <p id="lab-status-badge" class="mt-2"></p>
            </div>
            <button onclick="loadLabDetails()" class="text-brand-600 hover:text-brand-700 text-sm font-bold">
                <i class="fas fa-sync-alt mr-1"></i> Refresh Data
            </button>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Total Reports</h3>
                    <div class="w-10 h-10 rounded-xl bg-brand-50 flex items-center justify-center text-brand-600">
                        <i class="fas fa-file-medical text-lg"></i>
                    </div>
                </div>
                <p class="text-3xl font-black text-slate-800" id="stat-total-reports">0</p>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Pending Reports</h3>
                    <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600">
                        <i class="fas fa-clock text-lg"></i>
                    </div>
                </div>
                <p class="text-3xl font-black text-slate-800" id="stat-pending-reports">0</p>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Total Patients</h3>
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600">
                        <i class="fas fa-users text-lg"></i>
                    </div>
                </div>
                <p class="text-3xl font-black text-slate-800" id="stat-patients">0</p>
            </div>
        </div>

        <!-- Staff Table -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="p-6 border-b border-slate-200 bg-slate-50/50">
                <h2 class="text-lg font-bold text-slate-800">Laboratory Staff</h2>
                <p class="text-xs text-slate-500 mt-1">Manage users associated with this tenant.</p>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500 font-bold">
                            <th class="p-4 pl-6">Name</th>
                            <th class="p-4">Email</th>
                            <th class="p-4">Role</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right pr-6">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="staff-tbody" class="divide-y divide-slate-100 text-sm">
                        <!-- Rendered via JS -->
                        <tr><td colspan="5" class="p-8 text-center text-slate-400">Loading staff...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- UI Helpers -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/lab-details.js"></script>
</body>
</html>
